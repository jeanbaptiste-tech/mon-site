<!DOCTYPE html>

  <head>

    <title>AMAEDC - Accueil</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- Vidéo de fond qui occupe tout l'écran -->
    <video autoplay muted loop id="video-background">
      <source src="vidoes/132570-754103118_small.mp4" type="video/mp4" />

      Votre navigateur ne supporte pas la vidéo.
    </video>

    <!-- Logo placé au-dessus de la vidéo -->
    <div id="image-overlay">
      <img src="images/cameroun.imgT.pngcopie.png" alt="Logo AMAEDC" />

    <header>

      <h1 class="tooltip">
        AMAEDC
        <span class="tooltiptext">
          Association à But Non Lucratif qui œuvre pour les enfants défavorisés
          du Cameroun
        </span>

      <!-- Menu de navigation -->
      <nav>
        <a href="index.html">Accueil</a>
        <a href="#">Nous connaitre</a>
        <a href="#">Nos actions</a>
        <a href="#">Nous soutenir</a>
        <a href="#">Nos combats</a>
      </nav>
    </header>

    <main>
      <!-- Slogan principal -->
      <h2>par ici</h2>
    </main>

    <footer>
      <!-- Pied de page gauche -->
      <div class="footer-left">
        <p>Mentions légales</p>
        <p>Politique de confidentialité</p>
        <p>Plan du site</p>
      </div>

      <!-- Pied de page droit -->
      <div class="footer-right">
        <p>Facebook</p>
        <p>Instagram</p>
        <p>Contact</p>
